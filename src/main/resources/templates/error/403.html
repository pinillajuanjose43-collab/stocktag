<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Acceso denegado')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid py-3">
    <div class="formulario-contenedor border rounded p-4">
        <i class="bi bi-shield-lock fs-3 d-block mb-2 text-body-secondary" aria-hidden="true"></i>
        <h1 class="h5">No tienes acceso a esta página</h1>
        <p class="text-body-secondary mb-3">
            Tu usuario no tiene permiso para ver esta sección. Si crees que es un error, comunícate con el
            administrador de la plataforma.
        </p>
        <a sec:authorize="hasRole('ADMIN_PLATAFORMA')" th:href="@{/admin}"
           class="btn btn-barra d-inline-flex align-items-center gap-2">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Ir a empresas
        </a>
        <a sec:authorize="!hasRole('ADMIN_PLATAFORMA')" th:href="@{/}"
           class="btn btn-barra d-inline-flex align-items-center gap-2">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Ir al inventario
        </a>
    </div>
</main>
</body>
</html>
