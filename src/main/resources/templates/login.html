<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 d-flex align-items-center py-4">
    <div class="container login-contenedor">
        <div class="card border">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">Iniciar sesión</h1>
                <p class="text-body-secondary small mb-3">Ingresa con el usuario que te asignó el administrador.</p>

                <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                    Usuario o contraseña incorrectos.
                </div>
                <div th:if="${param.desactivada}" class="alert alert-warning py-2 small" role="alert">
                    Tu empresa está desactivada. Comunícate con el administrador de la plataforma.
                </div>
                <div th:if="${param.salida}" class="alert alert-secondary py-2 small" role="status">
                    Cerraste sesión correctamente.
                </div>

                <form th:action="@{/login}" method="post" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" id="username" name="username" class="form-control"
                               autocomplete="username" autocapitalize="none" spellcheck="false"
                               required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
