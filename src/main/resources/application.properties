spring.application.name=stocktag

# Base de datos H2 en modo archivo: los datos sobreviven a los reinicios (carpeta ./data, ignorada por git)
spring.datasource.url=jdbc:h2:file:./data/stocktag
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Plantillas Thymeleaf
spring.thymeleaf.cache=false

# Usuario ADMIN_PLATAFORMA inicial (solo se crea si no existe ningun administrador).
# Se pueden cambiar con las variables de entorno STOCKTAG_ADMIN_USERNAME y STOCKTAG_ADMIN_PASSWORD.
stocktag.admin.username=${STOCKTAG_ADMIN_USERNAME:admin}
stocktag.admin.password=${STOCKTAG_ADMIN_PASSWORD:admin123}
